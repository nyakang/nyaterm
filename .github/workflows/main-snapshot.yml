name: Main Snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-snapshot
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  NYATERM_GITHUB_GIST_CLIENT_ID: ${{ vars.NYATERM_GITHUB_GIST_CLIENT_ID }}
  SNAPSHOT_TAG: main-snapshot

jobs:
  prepare:
    name: Resolve and test main
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      main_sha: ${{ steps.metadata.outputs.main_sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve main commit
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          [[ -n "${main_sha}" ]] || { echo 'failed to resolve main' >&2; exit 1; }
          echo "main_sha=${main_sha}" >> "${GITHUB_OUTPUT}"

      - name: Checkout main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.metadata.outputs.main_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve workspace version
        id: version
        shell: bash
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Verify build configuration
        env:
          NYATERM_GITHUB_GIST_CLIENT_ID: ${{ vars.NYATERM_GITHUB_GIST_CLIENT_ID }}
        shell: bash
        run: |
          if [[ -z "${NYATERM_GITHUB_GIST_CLIENT_ID:-}" ]]; then
            echo 'NYATERM_GITHUB_GIST_CLIENT_ID repository variable is required' >&2
            exit 1
          fi

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: main-snapshot-preflight
      - name: Install Linux system dependencies
        uses: ./.github/actions/install-linux-deps
      - name: Prepare Android native dependencies
        shell: bash
        run: |
          python3 scripts/release/prepare_android.py
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          target = subprocess.check_output(['rustc', '-vV'], text=True).split('host: ')[1].splitlines()[0]
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'FFMPEG_DIR={(Path("target/android-deps/ffmpeg") / target).resolve()}\n')
          PY
      - name: Test workspace
        run: cargo test --workspace --locked --no-fail-fast
      - name: Test packaging and release helpers
        run: python scripts/ci/test_scripts.py
      - name: Check workflow syntax
        run: >-
          docker run --rm
          -v "${PWD}:/repo"
          -w /repo
          rhysd/actionlint:1.7.7

  package:
    needs: prepare
    uses: ./.github/workflows/native-package.yml
    with:
      source_sha: ${{ needs.prepare.outputs.main_sha }}
      version: ${{ needs.prepare.outputs.version }}
      artifact_version: main-snapshot
      release_type: snapshot
      artifact_prefix: main-snapshot

  publish:
    name: Publish main snapshot
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.main_sha }}
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: main-snapshot-*
          path: release-assets
          merge-multiple: true
      - name: Validate snapshot assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          python3 scripts/ci/check_release_assets.py --dist release-assets
          --version "${VERSION}" --artifact-version main-snapshot
      - name: Download package provenance
        uses: actions/download-artifact@v4
        with:
          pattern: provenance-*
          path: provenance
          merge-multiple: true
      - name: Verify snapshot provenance
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.main_sha }}
        run: >-
          python scripts/release/release_provenance.py verify
          --dist release-assets --records provenance --version "$VERSION"
          --source-sha "$SOURCE_SHA" --run-id "$GITHUB_RUN_ID" --artifact-version main-snapshot
      - name: Back up current snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.main_sha }}
        run: python scripts/release/snapshot_release.py backup --source-sha "$SOURCE_SHA"
      - name: Retain snapshot preimage before replacing assets
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-preimage-${{ github.run_attempt }}
          path: snapshot-recovery/
          if-no-files-found: error
          retention-days: 7
      - name: Publish verified snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release/snapshot_release.py publish
      - name: Retain snapshot recovery journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-recovery-${{ github.run_attempt }}
          path: snapshot-recovery/
          if-no-files-found: warn
          retention-days: 7
