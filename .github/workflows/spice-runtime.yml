name: SPICE native runtime

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/nyaterm-spice-helper/**'
      - 'crates/nyaterm-remote-desktop/src/spice/**'
      - 'scripts/release/*spice*'
      - 'scripts/release/native_headers.py'
      - 'scripts/ci/*spice*'
      - 'scripts/tests/test_prepare_spice.py'
      - 'scripts/tests/test_spice_release_integration.py'
      - '.github/workflows/spice-runtime.yml'
      - 'Cargo.lock'

permissions:
  contents: read

jobs:
  runtime:
    name: Native SPICE ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, target: x86_64-pc-windows-msvc, native: true }
          - { os: windows-2025, target: aarch64-pc-windows-msvc, native: false }
          - { os: macos-15, target: aarch64-apple-darwin, native: true }
          - { os: macos-15-intel, target: x86_64-apple-darwin, native: true }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, native: true }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, native: true }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: spice-${{ matrix.target }}
      - name: Install packaging modules
        run: python -m pip install pefile==2024.8.26 zstandard==0.25.0 pyparsing==3.2.5
      - name: Install native dependencies
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/ci/install-spice-deps.sh
      - name: Install Linux audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libasound2-dev
      - name: Prepare and verify runtime
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts/release')
          import prepare_spice
          target = os.environ['TARGET']
          runtime = prepare_spice.prepare(target)
          prepare_spice.verify_runtime(runtime, target)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as stream:
              stream.write(f'NYATERM_SPICE_RUNTIME={runtime}\n')
              stream.write(f'NYATERM_TEST_SPICE_RUNTIME={runtime}\n')
          PY
          python -m unittest scripts.tests.test_prepare_spice
      - name: Check helper for target architecture
        # Use the runner's default shell: Git Bash puts its coreutils link.exe
        # ahead of the MSVC linker on Windows.
        run: cargo check --locked -p nyaterm-spice-helper --all-targets --target "${{ matrix.target }}"
      - name: Run helper, lifecycle, TLS and plugin probes
        if: matrix.native
        run: |
          cargo test --locked --release -p nyaterm-spice-helper --lib
          cargo run --locked --release -p nyaterm-spice-helper --example probe -- --require-video
          cargo test --locked --release -p nyaterm-spice-helper --test native_runtime -- --ignored --test-threads=1
          cargo test --locked --release -p nyaterm-spice-helper --features test-support --test lifecycle -- --include-ignored --test-threads=1
      - name: Probe Unix relocation and decoder construction
        if: runner.os != 'Windows'
        shell: bash
        run: python scripts/ci/probe_spice_runtime.py "${NYATERM_SPICE_RUNTIME}"
      - name: Verify runtime remains immutable and stages into packages
        run: python -m unittest scripts.tests.test_spice_release_integration
      - name: Record validation limits
        shell: bash
        env:
          NATIVE: ${{ matrix.native }}
        run: |
          echo "SPICE runtime prepared for ${{ matrix.target }}. Native execution: ${NATIVE}. No real VM, GPUI, audio-device or throughput acceptance was performed." >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ runner.os }}" == macOS ]]; then
            echo "Pinned source runtime passed the macOS 12.0 Mach-O deployment gate. Execution on this newer runner does not replace macOS 12 device acceptance." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload runtime provenance
        uses: actions/upload-artifact@v4
        with:
          name: spice-runtime-provenance-${{ matrix.target }}
          path: ${{ env.NYATERM_SPICE_RUNTIME }}/SOURCE.json
          if-no-files-found: error
          retention-days: 14
