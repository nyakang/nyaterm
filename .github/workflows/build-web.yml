name: build-web

# Builds the headless web-server artifacts: the `nyaterm` server binary
# (server cargo feature) and the web-flavored frontend bundle, plus a Docker
# image combining both. Desktop release builds are handled by build-release.yml.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  IMAGE_NAME: nyaterm-web

permissions:
  contents: read
  packages: write

jobs:
  build-linux:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            arch: x64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web frontend
        run: pnpm build:web

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Rust system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev pkg-config

      - name: Install cross-compile linker (arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build MCP sidecar
        run: pnpm build:mcp-sidecar
        env:
          NYATERM_MCP_TARGET: ${{ matrix.target }}

      - name: Build server binary
        run: cargo build --release --features server --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml

      - name: Package
        run: |
          mkdir -p dist-web
          cp src-tauri/target/${{ matrix.target }}/release/nyaterm nyaterm-server-linux-${{ matrix.arch }}
          tar -czf nyaterm-web-linux-${{ matrix.arch }}.tar.gz \
            nyaterm-server-linux-${{ matrix.arch }} \
            README.md
          # Frontend bundle ships once (arch independent)
          tar -czf nyaterm-web-dist.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: nyaterm-web-linux-${{ matrix.arch }}
          path: |
            nyaterm-web-linux-${{ matrix.arch }}.tar.gz
            nyaterm-web-dist.tar.gz

  docker:
    runs-on: ubuntu-22.04
    needs: []
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
