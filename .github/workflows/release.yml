name: Release

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
      upload_release:
        required: false
        default: false
        type: boolean
      verify_release:
        required: false
        default: false
        type: boolean
      source_run_id:
        required: false
        type: string
      source_ref:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Optional version; must match the Cargo workspace version
        required: false
        type: string
      upload_release:
        description: Publish GitHub and downstream release channels
        required: false
        default: false
        type: boolean
      verify_release:
        description: Sign and verify artifacts without publishing
        required: false
        default: false
        type: boolean
      source_run_id:
        description: Optional completed Release run ID with matching package provenance
        required: false
        type: string
      source_ref:
        description: Optional source ref to build; defaults to the triggering ref
        required: false
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  NYATERM_GITHUB_GIST_CLIENT_ID: ${{ vars.NYATERM_GITHUB_GIST_CLIENT_ID }}
  DOWNLOAD_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      source_sha: ${{ steps.source.outputs.sha }}
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve and validate release metadata
        id: release
        shell: bash
        env:
          INPUT_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_UPLOAD: ${{ inputs.upload_release }}
          INPUT_VERIFY: ${{ inputs.verify_release }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_SOURCE_RUN_ID:-}" && "${INPUT_UPLOAD:-false}" != 'true' && "${INPUT_VERIFY:-false}" != 'true' && "${GITHUB_REF_TYPE}" != 'tag' ]]; then
            echo 'source_run_id requires publishing or verify_release=true' >&2
            exit 1
          fi
          workspace_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          publish='false'
          if [[ "${GITHUB_REF_TYPE}" == 'tag' ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            publish='true'
          else
            version="${INPUT_VERSION#v}"
            version="${version:-${workspace_version}}"
            tag="v${version}"
            if [[ "${INPUT_UPLOAD:-false}" == 'true' ]]; then
              [[ -n "${INPUT_VERSION:-}" ]] || {
                echo 'manual release publishing requires the version input' >&2
                exit 1
              }
              publish='true'
            fi
          fi
          python3 - "${version}" "${workspace_version}" <<'PY'
          import re
          import sys
          version, workspace = sys.argv[1:]
          semver = r"[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?"
          if not re.fullmatch(semver, version):
              raise SystemExit(f"invalid release version: {version}")
          if version != workspace:
              raise SystemExit(f"release version {version} does not match Cargo workspace version {workspace}")
          PY
          prerelease='false'
          [[ "${version%%+*}" == *-* ]] && prerelease='true'
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "publish=${publish}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

      - name: Resolve release source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          if [[ -z "${SOURCE_RUN_ID:-}" ]]; then
            echo "sha=${source_sha}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          [[ "${SOURCE_RUN_ID}" =~ ^[0-9]+$ ]] || {
            echo 'source_run_id must be a numeric GitHub Actions run ID' >&2
            exit 1
          }

          source_workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq '.workflow_id')"
          current_workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml" --jq '.id')"
          source_status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq '.status')"

          [[ "${source_workflow_id}" == "${current_workflow_id}" ]] || {
            echo "run ${SOURCE_RUN_ID} was not produced by release.yml" >&2
            exit 1
          }
          # A failed publication may still contain a fully verified signed candidate.
          # Its complete provenance, inventory and signatures are checked before reuse.
          [[ "${source_status}" == 'completed' ]] || {
            echo "run ${SOURCE_RUN_ID} has not completed" >&2
            exit 1
          }
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "run ${SOURCE_RUN_ID} returned an invalid head SHA" >&2
            exit 1
          }
          echo "sha=${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Wait for populated draft release
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          expected="$(printf 'true\t%s\ttrue' "${PRERELEASE}")"
          for _ in {1..36}; do
            actual="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --json isDraft,isPrerelease,body \
              --jq '[.isDraft,.isPrerelease,(.body | length > 0)] | @tsv' 2>/dev/null || true)"
            published="$(printf 'false\t%s\ttrue' "${PRERELEASE}")"
            if [[ "${actual}" == "${expected}" || ( -n "${SOURCE_RUN_ID}" && "${actual}" == "${published}" ) ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "Missing populated matching draft release for ${TAG}" >&2
          exit 1
      - name: Bind formal tag to frozen source
        if: steps.release.outputs.publish == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: test "$(git rev-parse "${TAG}^{commit}")" = "$SOURCE_SHA"
      - name: Verify build configuration
        if: inputs.source_run_id == ''
        shell: bash
        env:
          NYATERM_GITHUB_GIST_CLIENT_ID: ${{ vars.NYATERM_GITHUB_GIST_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${NYATERM_GITHUB_GIST_CLIENT_ID:-}" ]]; then
            echo 'NYATERM_GITHUB_GIST_CLIENT_ID repository variable is required' >&2
            exit 1
          fi

      - name: Set up Rust
        if: inputs.source_run_id == ''
        uses: ./.github/actions/setup-rust
        with:
          cache-key: release-preflight
      - name: Install Linux system dependencies
        if: inputs.source_run_id == ''
        uses: ./.github/actions/install-linux-deps
      - name: Test workspace
        if: inputs.source_run_id == ''
        run: cargo test --workspace --locked --no-fail-fast
      - name: Test packaging and release helpers
        if: inputs.source_run_id == ''
        run: python scripts/ci/test_scripts.py
      - name: Check workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          # A recovery dispatch may build a frozen source_ref with an updated workflow.
          # Lint the workflow revision that actually triggered this run, not the frozen source tree.
          git show "${GITHUB_SHA}:.github/workflows/release.yml" > .github/workflows/release.yml
          docker run --rm -v "${PWD}:/repo" -w /repo rhysd/actionlint:1.7.7

  package:
    needs: preflight
    if: inputs.source_run_id == ''
    uses: ./.github/workflows/native-package.yml
    with:
      source_sha: ${{ needs.preflight.outputs.source_sha }}
      version: ${{ needs.preflight.outputs.version }}
      artifact_version: ${{ needs.preflight.outputs.version }}
      release_type: release
      artifact_prefix: NyaTerm

  focal:
    needs: preflight
    if: inputs.source_run_id == ''
    uses: ./.github/workflows/linux-focal.yml
    with:
      source_ref: ${{ needs.preflight.outputs.source_sha }}

  prepare_release:
    name: Sign and verify release candidate
    needs: [preflight, package, focal]
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      (needs.preflight.outputs.publish == 'true' || inputs.verify_release == true) &&
      ((needs.package.result == 'success' && needs.focal.result == 'success') ||
      (inputs.source_run_id != '' &&
      needs.package.result == 'skipped' && needs.focal.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    outputs:
      version: ${{ needs.preflight.outputs.version }}
      tag: ${{ needs.preflight.outputs.tag }}
      prerelease: ${{ needs.preflight.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.source_sha }}
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install signature verification tool
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Download package artifacts
        if: inputs.source_run_id == ''
        uses: actions/download-artifact@v4
        with:
          pattern: NyaTerm-*
          path: dist-release
          merge-multiple: true
      - name: Download package provenance
        if: inputs.source_run_id == ''
        uses: actions/download-artifact@v4
        with:
          pattern: provenance-*
          path: provenance
          merge-multiple: true
      - name: Download reused signed candidate
        if: inputs.source_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: release-candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
      - name: Verify reused signed candidate
        if: inputs.source_run_id != ''
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: >-
          python scripts/release/verify_candidate.py --version "$VERSION"
          --source-sha "$SOURCE_SHA" --run-id "$SOURCE_RUN_ID"
      - name: Verify package provenance
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || github.run_id }}
        run: >-
          python scripts/release/release_provenance.py verify
          --dist dist-release --records provenance --source-sha "${SOURCE_SHA}"
          --version "${VERSION}" --run-id "${SOURCE_RUN_ID}" --include-focal
      - name: Validate release assets
        if: inputs.source_run_id == ''
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: >-
          python3 scripts/ci/check_release_assets.py --dist dist-release
          --version "${VERSION}" --artifact-version "${VERSION}" --include-focal
      - name: Prepare release notes
        if: inputs.source_run_id == ''
        id: metadata
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          PUBLISH: ${{ needs.preflight.outputs.publish }}
          TAG: ${{ needs.preflight.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${PUBLISH}" == 'true' ]]; then
            gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json body --jq '.body' > release-notes.md
            [[ -s release-notes.md ]] || { echo 'Draft release body is empty' >&2; exit 1; }
          elif [[ -f "scripts/release/notes/${VERSION}.md" ]]; then
            cp "scripts/release/notes/${VERSION}.md" release-notes.md
          else
            printf 'NyaTerm %s\n\n' "${VERSION}" > release-notes.md
            previous_tag="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
            if [[ -n "${previous_tag}" ]]; then
              git log --no-merges --format='- %s' "${previous_tag}..HEAD" >> release-notes.md
            else
              git log -20 --no-merges --format='- %s' >> release-notes.md
            fi
          fi
          echo "published_at=$(git show -s --format=%cI HEAD)" >> "${GITHUB_OUTPUT}"
      - name: Sign and verify legacy updater artifacts
        if: inputs.source_run_id == ''
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY_B64: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_B64 }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ needs.preflight.outputs.version }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY_B64:-}" || -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]]; then
            echo 'Tauri updater signing key and password are required' >&2
            exit 1
          fi
          # Keep the decoded key inside this shell; GITHUB_ENV is printed in later steps.
          TAURI_SIGNING_PRIVATE_KEY="$(printf '%s' "${TAURI_SIGNING_PRIVATE_KEY_B64}" | base64 --decode)"
          export TAURI_SIGNING_PRIVATE_KEY
          cp scripts/release/updater-public-key.txt "${RUNNER_TEMP}/nyaterm-updater.pub"
          files=(
            "dist-release/NyaTerm_${VERSION}_macos_arm64.app.tar.gz"
            "dist-release/NyaTerm_${VERSION}_macos_x64.app.tar.gz"
            "dist-release/NyaTerm_${VERSION}_linux_arm64.AppImage"
            "dist-release/NyaTerm_${VERSION}_linux_x64.AppImage"
            "dist-release/NyaTerm_${VERSION}_windows_arm64-setup.exe"
            "dist-release/NyaTerm_${VERSION}_windows_x64-setup.exe"
            "dist-release/NyaTerm_${VERSION}_windows_arm64_portable.zip"
            "dist-release/NyaTerm_${VERSION}_windows_x64_portable.zip"
          )
          if [[ "${PRERELEASE}" == 'false' ]]; then
            files+=(
              "dist-release/NyaTerm_${VERSION}_windows_arm64.msi"
              "dist-release/NyaTerm_${VERSION}_windows_x64.msi"
            )
          fi
          for file in "${files[@]}"; do
            npx --yes @tauri-apps/cli@2.10.0 signer sign --password "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" "${file}"
          done
          unset TAURI_SIGNING_PRIVATE_KEY
          python3 scripts/release/verify_updater_signatures.py \
            --dist dist-release --version "${VERSION}" \
            --public-key "${RUNNER_TEMP}/nyaterm-updater.pub"
      - name: Test signature rejection
        run: python3 -m unittest scripts.tests.test_verify_updater_signatures -v
      - name: Generate checksums and manifests
        if: inputs.source_run_id == ''
        shell: bash
        env:
          BASE_URL: ${{ env.DOWNLOAD_BASE_URL }}
          PUB_DATE: ${{ steps.metadata.outputs.published_at }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          [[ -n "${BASE_URL:-}" ]] || { echo 'R2_PUBLIC_BASE_URL repository variable is required' >&2; exit 1; }
          python3 scripts/release/generate_release_metadata.py \
            --dist dist-release --version "${VERSION}" --tag "${TAG}" \
            --base-url "${BASE_URL}" --notes-file release-notes.md --pub-date "${PUB_DATE}" --include-focal
          python3 scripts/release/verify_release_metadata.py \
            --directory dist-release --version "${VERSION}" --tag "${TAG}" \
            --base-url "${BASE_URL}"
          rm -- dist-release/*.sig
      - name: Save verified release candidate
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          overwrite: true
          path: |
            dist-release/*
            provenance/*.json
            release-notes.md
          if-no-files-found: error
          retention-days: 30

  release:
    name: Upload assets to GitHub draft
    needs: [preflight, prepare_release]
    if: >-
      always() && needs.preflight.result == 'success' &&
      needs.prepare_release.result == 'success' && needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
      - name: Stage verified GitHub assets without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: python scripts/release/release_channel.py stage-github --version "$VERSION"

  r2:
    name: Stage Cloudflare R2 version assets
    needs: [preflight, release]
    if: >-
      always() && needs.preflight.result == 'success' &&
      needs.release.result == 'success' && needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_BUCKET: nyaterm
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
      - name: Create or verify immutable version assets
        run: python scripts/release/release_channel.py stage --version "$VERSION"

  publish:
    name: Commit verified release channel
    needs: [preflight, release, r2]
    if: >-
      always() && needs.preflight.result == 'success' &&
      needs.release.result == 'success' && needs.r2.result == 'success' &&
      needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: release-channel-${{ needs.preflight.outputs.prerelease == 'true' && 'preview' || 'stable' }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_BUCKET: nyaterm
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      VERSION: ${{ needs.preflight.outputs.version }}
      SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
      - name: Save channel preimage and validate version progression
        run: python scripts/release/release_channel.py backup --version "$VERSION"
      - name: Retain preimage before the first channel write
        uses: actions/upload-artifact@v4
        with:
          name: channel-preimage-${{ github.run_attempt }}
          path: channel-recovery/
          if-no-files-found: error
          retention-days: 90
      - name: Commit channel and publish verified draft
        run: python scripts/release/release_channel.py commit --version "$VERSION"
      - name: Create published release receipt
        run: >-
          python scripts/release/release_receipt.py create --version "$VERSION"
          --source-sha "$SOURCE_SHA" --run-id "$GITHUB_RUN_ID"
      - name: Save downstream publication receipt
        uses: actions/upload-artifact@v4
        with:
          name: published-release
          path: release-receipt.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90
      - name: Save downstream release tag
        uses: actions/upload-artifact@v4
        with:
          name: published-release-tag
          path: published-release-tag.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 90
      - name: Retain publication progress and recovery journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-recovery-${{ github.run_attempt }}
          path: channel-recovery/
          if-no-files-found: warn
          retention-days: 90
