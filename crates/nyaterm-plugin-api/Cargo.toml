[package]
name = "nyaterm-plugin-api"
version = "2.0.0"
edition = "2024"
rust-version = "1.89"
license.workspace = true
repository.workspace = true
description = "Rust guest SDK and WIT for NyaTerm plugins"

[features]
default = ["guest"]
guest = ["dep:wit-bindgen"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = { workspace = true, optional = true }
