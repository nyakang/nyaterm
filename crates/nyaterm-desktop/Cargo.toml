[package]
name = "nyaterm-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tempfile.workspace = true
anyhow.workspace = true
base64.workspace = true
dirs.workspace = true
futures.workspace = true
gpui.workspace = true
hex.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
keyring.workspace = true
nyaterm-ai-client.workspace = true
nyaterm-agent-client.workspace = true
nyaterm-cloud-storage.workspace = true
nyaterm-core.workspace = true
nyaterm-android.workspace = true
nyaterm-mcp-protocol.workspace = true
nyaterm-mcp-host.workspace = true
nyaterm-otp.workspace = true
nyaterm-preview.workspace = true
nyaterm-translation-client.workspace = true
nyaterm-plugin-host.workspace = true
nyaterm-remote-desktop.workspace = true
nyaterm-store.workspace = true
nyaterm-sync.workspace = true
nyaterm-terminal.workspace = true
nyaterm-terminal-gpui.workspace = true
nyaterm-terminal-runtime.workspace = true
nyaterm-transport.workspace = true
nyaterm-recording.workspace = true
nyaterm-remote-ops.workspace = true
nyaterm-files.workspace = true
nyaterm-ui.workspace = true
nyaterm-updater.workspace = true
regex.workspace = true
rust-i18n.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
raw-window-handle = "0.6"
tray-icon = { version = "=0.24.2", default-features = false, features = ["gtk"] }
uuid.workspace = true
url.workspace = true
zip.workspace = true
zeroize.workspace = true

[dev-dependencies]
nyaterm-terminal-runtime = { workspace = true, features = ["test-support"] }
russh.workspace = true
nyaterm-recording = { workspace = true, features = ["test-support"] }
nyaterm-cloud-storage = { workspace = true, features = ["test-support"] }
tracing-subscriber.workspace = true
gpui = { workspace = true, features = ["test-support", "profiler"] }
gpui_platform = { workspace = true, features = ["test-support"] }
nyaterm-core = { workspace = true, features = ["test-support"] }
redb.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
nyaterm-windows-rdp.workspace = true
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
x11rb = { version = "0.13.2", features = ["allow-unsafe-code"] }
