[package]
name = "nyaterm-agent-client"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
test-support = []

[[bin]]
name = "nyaterm-acp-test-agent"
path = "tests/support/agent.rs"
required-features = ["test-support"]

[dependencies]
agent-client-protocol.workspace = true
blocking.workspace = true
futures.workspace = true
tokio.workspace = true
serde.workspace = true
thiserror.workspace = true
nyaterm-core.workspace = true
serde_json.workspace = true
tracing.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
nyaterm-core = { workspace = true, features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Security", "Win32_System_Threading",
    "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp",
] }
