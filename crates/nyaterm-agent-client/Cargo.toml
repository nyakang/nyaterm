[package]
name = "nyaterm-agent-client"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nyaterm-core.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
nyaterm-core = { workspace = true, features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Security", "Win32_System_Threading",
    "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp",
] }
