[package]
name = "nyaterm-mosh"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
description = "Embedded Mosh client and prediction engine"

[dependencies]
aes = { version = "0.8", features = ["zeroize"] }
base64 = "0.22"
flate2 = "1"
getrandom = "0.2"
thiserror = "2"
libc = "0.2"
quinn-udp = { version = "=0.5.14", default-features = false }
socket2 = "0.6"
unicode-width = "0.2.2"
zeroize.workspace = true

[dev-dependencies]
hex = "0.4"
rand = "0.8"
