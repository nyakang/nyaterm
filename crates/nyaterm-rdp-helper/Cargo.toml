[package]
name = "nyaterm-rdp-helper"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "nyaterm-rdp-helper"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
arboard = { version = "3", features = ["wayland-data-control"] }
dirs.workspace = true
hostname = "0.4.1"
ironrdp-client = { version = "0.1.0", features = ["clipboard", "rustls"] }
ironrdp-cliprdr = "0.9"
ironrdp-core = { version = "0.3", features = ["alloc"] }
ironrdp-input.workspace = true
ironrdp-pdu = "0.11"
# Only for the certificate-validation policy types named by `ConfigBuilder`.
# ironrdp-client does not re-export them.
ironrdp-tls = { version = "0.3", default-features = false }
nyaterm-remote-desktop.workspace = true
rustls.workspace = true
sha2.workspace = true
smallvec = "1.15"
tokio.workspace = true
uuid.workspace = true
x509-cert = { version = "0.2", default-features = false, features = ["std"] }

[dev-dependencies]
ironrdp-svc = "0.10"
nyaterm-core = { workspace = true, features = ["test-support"] }
