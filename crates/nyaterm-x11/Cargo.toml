[package]
name = "nyaterm-x11"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nyaterm-core.workspace = true
nyaterm-native-protocol.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
tempfile.workspace = true
