[package]
name = "nyaterm-files"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nyaterm-core.workspace = true
nyaterm-android.workspace = true
nyaterm-transport.workspace = true
anyhow.workspace = true
base64.workspace = true
dirs.workspace = true
encoding_rs.workspace = true
futures.workspace = true
same-file.workspace = true
tempfile.workspace = true
russh.workspace = true
russh-sftp.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
tokio-util.workspace = true
unicode-normalization.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }

[dev-dependencies]
nyaterm-terminal.workspace = true
nyaterm-core = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
