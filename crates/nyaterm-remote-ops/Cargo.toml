[package]
name = "nyaterm-remote-ops"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nyaterm-core.workspace = true
nyaterm-transport.workspace = true
anyhow.workspace = true
serde.workspace = true
tracing.workspace = true
serde_json.workspace = true
tokio.workspace = true
zeroize.workspace = true
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk", "network", "user"] }

[dev-dependencies]
russh.workspace = true
tempfile.workspace = true
nyaterm-core = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
listeners = "0.5"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Services", "Win32_System_RemoteDesktop", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO"] }
