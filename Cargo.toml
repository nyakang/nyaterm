[workspace]
# Native protocol helpers are independently built in nyaterm-plugins.
# Debug sessions can resolve explicitly supplied or adjacent helper executables.
default-members = [
    "crates/nyaterm-app",
    "crates/nyaterm-mcp",
]
members = [
    "crates/nyaterm-agent-client",
    "crates/nyaterm-ai-client",
    "crates/nyaterm-android",
    "crates/nyaterm-app",
    "crates/nyaterm-cloud-storage",
    "crates/nyaterm-completion-runtime",
    "crates/nyaterm-core",
    "crates/nyaterm-desktop",
    "crates/nyaterm-executor",
    "crates/nyaterm-files",
    "crates/nyaterm-host-tools-gpui",
    "crates/nyaterm-remote-monitor-gpui",
    "crates/nyaterm-connections-gpui",
    "crates/nyaterm-file-browser-gpui",
    "crates/nyaterm-ai-gpui",
    "crates/nyaterm-notes-gpui",
    "crates/nyaterm-i18n",
    "crates/nyaterm-mcp",
    "crates/nyaterm-mcp-host",
    "crates/nyaterm-mcp-protocol",
    "crates/nyaterm-otp",
    "crates/nyaterm-plugin-api",
    "crates/nyaterm-plugin-host",
    "crates/nyaterm-preview",
    "crates/nyaterm-recording",
    "crates/nyaterm-remote-desktop",
    "crates/nyaterm-remote-ops",
    "crates/nyaterm-store",
    "crates/nyaterm-sync",
    "crates/nyaterm-terminal",
    "crates/nyaterm-terminal-gpui",
    "crates/nyaterm-terminal-runtime",
    "crates/nyaterm-translation-client",
    "crates/nyaterm-transport",
    "crates/nyaterm-ui",
    "crates/nyaterm-updater",
    "crates/nyaterm-windows-rdp",
]
resolver = "3"
# Reference fork checkouts under temp/vendor are not application build inputs.
# temp/nyaterm-plugins is an independent workspace; the app uses its Git-pinned
# protocol dependency above local files. Exclude local reference/guest workspaces.
exclude = ["temp", "examples/plugins/guests"]

[workspace.package]
version = "2.0.8"
edition = "2024"
authors = ["Kang"]
license = "Apache-2.0"
repository = "https://github.com/nyakang/nyaterm"

[workspace.dependencies]
nyaterm-native-protocol = { git = "https://github.com/nyakang/nyaterm-plugins", rev = "cb91fcb46ddef66457ae8f02a6b72f2b7ec1f7ef" }
agent-client-protocol = { version = "=5.5.1", features = ["unstable_auth_status"] }
blocking = "1"
nyaterm-remote-monitor-gpui = { path = "crates/nyaterm-remote-monitor-gpui" }
nyaterm-connections-gpui = { path = "crates/nyaterm-connections-gpui" }
nyaterm-file-browser-gpui = { path = "crates/nyaterm-file-browser-gpui" }
nyaterm-ai-gpui = { path = "crates/nyaterm-ai-gpui" }
nyaterm-notes-gpui = { path = "crates/nyaterm-notes-gpui" }
nyaterm-host-tools-gpui = { path = "crates/nyaterm-host-tools-gpui" }
nyaterm-executor = { path = "crates/nyaterm-executor" }
nyaterm-completion-runtime = { path = "crates/nyaterm-completion-runtime" }
nyaterm-i18n = { path = "crates/nyaterm-i18n" }
nyaterm-android = { path = "crates/nyaterm-android" }
nucleo-matcher = "0.3.1"
automerge = "=0.12.0"
httpdate = "1.0"
http = "1"
opendal = { version = "=0.59.5", default-features = false, features = ["executors-tokio", "services-webdav", "services-s3", "services-gdrive", "services-onedrive", "services-aliyun-drive", "layers-timeout", "layers-retry"] }
aes-gcm = "0.11"
aes = { version = "0.8", features = ["zeroize"] }
cbc = "0.1"
pbkdf2 = "0.12"
sha3 = "0.10"
argon2 = { version = "0.5.3", features = ["zeroize"] }
alacritty_terminal = "0.26.1-dev"
anyhow = "1"
async-http-proxy = { version = "1.2.5", features = ["runtime-tokio", "basic-auth"] }
base64 = "0.22"
bytes = "1.7"
crypto_secretbox = "0.1"
digest = "0.11.0-rc.5"
dirs = "6"
encoding_rs = "0.8"
flate2 = "1.1"
futures = "0.3"
genai = { version = "=0.7.3", default-features = false, features = ["rustls-tls", "system-proxy"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "stream", "socks", "system-proxy"] }
same-file = "1"
tempfile = "3"
glob = "0.3.4"
gpui = { version = "=0.2.2", git = "https://github.com/nyakang/zed", rev = "474dcb1d85d34c30aceef1900b24e4d27665eee8" }
gpui-base = { git = "https://github.com/nyakang/gpui-kit", rev = "a4c92a92dfe87c194a2f2859468f6d80b936c2ae" }
gpui-kit = { git = "https://github.com/nyakang/gpui-kit", rev = "a4c92a92dfe87c194a2f2859468f6d80b936c2ae" }
gpui_platform = { git = "https://github.com/nyakang/zed", rev = "474dcb1d85d34c30aceef1900b24e4d27665eee8" }
# Pure-Rust, `#![forbid(unsafe)]` PDF rasterizer (MIT OR Apache-2.0). Pinned
# exactly: the crate is pre-1.0 and explicitly experimental, so a caret range
# could pull in a breaking 0.8 without review. `embed-fonts` bundles the 14
# permissively-licensed standard-font substitutes so previews of PDFs that rely
# on non-embedded base fonts still render without custom font loading.
hayro = { version = "=0.7.1", features = ["embed-fonts"] }
hex = "0.4"
hmac = "0.13"
jsonc-parser = { version = "0.34", features = ["serde"] }
keyring = { version = "3.6", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
log = "0.4.11"
md5 = "0.8"
nyaterm-core = { path = "crates/nyaterm-core" }
nyaterm-mcp-protocol = { path = "crates/nyaterm-mcp-protocol" }
nyaterm-mcp-host = { path = "crates/nyaterm-mcp-host" }
nyaterm-desktop = { path = "crates/nyaterm-desktop" }
nyaterm-ai-client = { path = "crates/nyaterm-ai-client" }
nyaterm-agent-client = { path = "crates/nyaterm-agent-client" }
nyaterm-cloud-storage = { path = "crates/nyaterm-cloud-storage" }
nyaterm-otp = { path = "crates/nyaterm-otp" }
nyaterm-preview = { path = "crates/nyaterm-preview" }
nyaterm-translation-client = { path = "crates/nyaterm-translation-client" }
nyaterm-plugin-api = { path = "crates/nyaterm-plugin-api" }
nyaterm-plugin-host = { path = "crates/nyaterm-plugin-host" }
nyaterm-remote-desktop = { path = "crates/nyaterm-remote-desktop" }
nyaterm-windows-rdp = { path = "crates/nyaterm-windows-rdp" }
nyaterm-store = { path = "crates/nyaterm-store" }
nyaterm-sync = { path = "crates/nyaterm-sync" }
nyaterm-terminal = { path = "crates/nyaterm-terminal" }
nyaterm-terminal-runtime = { path = "crates/nyaterm-terminal-runtime" }
nyaterm-terminal-gpui = { path = "crates/nyaterm-terminal-gpui" }
nyaterm-recording = { path = "crates/nyaterm-recording" }
nyaterm-remote-ops = { path = "crates/nyaterm-remote-ops" }
nyaterm-files = { path = "crates/nyaterm-files" }
nyaterm-transport = { path = "crates/nyaterm-transport" }
nyaterm-ui = { path = "crates/nyaterm-ui" }
nyaterm-updater = { path = "crates/nyaterm-updater" }
percent-encoding = "=2.3.2"
portable-pty = { git = "https://github.com/nyakang/portable-pty", rev = "52aa7aaac048f88f07341b5a89ed859f932d1f79" }
quick-xml = "0.40"
rand = { version = "0.10", features = ["thread_rng"] }
redb = "4.1.0"
regex = "1.11.1"
rmcp = "=3.1.4"
rustls = { version = "0.23.43", default-features = false, features = ["aws_lc_rs", "std"] }
russh = { git = "https://github.com/nyakang/russh", rev = "a5aed0488b9e9c88a79ebef3ce28e48a130e21b1", features = ["des", "dsa"] }
russh-sftp = { git = "https://github.com/nyakang/russh-sftp", rev = "2dc1ddef2365d4b77b2025586ce0cc2c72265b53" }
rusty-leveldb = "4.0"
rust-embed = { version = "8.11", features = ["include-exclude", "debug-embed"] }
rust-i18n = "4.2"
schemars = "=1.2.2"
serialport = { version = "4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# `no-log` enables log/max_level_off for the entire dependency graph. Sensitive
# FTP events are suppressed by the application's immutable all-sink filter.
suppaftp = { version = "13.0.0", default-features = false }
semver = { version = "1", features = ["serde"] }
sha1 = { version = "0.11", features = ["oid"] }
sha2 = { version = "0.11", features = ["oid"] }
signature = "3.0.0-rc.10"
ssh-key = "=0.7.0-rc.12"
thiserror = "2"
time = { version = "0.3.47", features = ["formatting", "local-offset", "macros", "parsing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util"] }
tokio-util = "=0.7.20"
tokio-socks = "0.5.2"
tracing = "0.1"
tracing-appender = "0.2.4"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Test-only. Feature set must mirror gpui's own usvg dependency (default-features
# = false) so asset tests cannot pass under capabilities the app does not build.
usvg = { version = "0.46", default-features = false }
url = "=2.5.8"
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
uuid = { version = "1", features = ["v4", "serde"] }
vte = "0.14"
zeroize = "1"
zmodem2 = { git = "https://github.com/nyakang/zmodem2", rev = "87a80216179f29d90e0b8c06ee5b4a6a0132c763" }
zed_reqwest = { package = "zed-reqwest", version = "0.12.15-zed", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls-native-roots",
    "socks",
] }
zip = { version = "8.2.0", default-features = false, features = ["deflate"] }
toml = "0.9"
wasmtime = { version = "=39.0.1", default-features = false, features = ["std", "runtime", "cranelift", "component-model"] }
wasmparser = "=0.240.0"
wit-bindgen = { version = "=0.49.0", default-features = false, features = ["macros", "realloc", "std"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package]
alacritty_terminal = { opt-level = 1, debug = false }
gpui = { opt-level = 1, debug = false }
gpui_platform = { opt-level = 1, debug = false }
regex = { opt-level = 1, debug = false }
regex-automata = { opt-level = 1, debug = false }
regex-syntax = { opt-level = 1, debug = false }
rustybuzz = { opt-level = 1, debug = false }
smol = { opt-level = 1, debug = false }
sum_tree = { opt-level = 1, debug = false }
swash = { opt-level = 1, debug = false }
taffy = { opt-level = 1, debug = false }
ttf-parser = { opt-level = 1, debug = false }

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = "full"

# Work around the Rust 1.99.1 / LLVM SIGBUS in clearKillsForDef on macOS x64
# while optimizing rust-i18n's large generated catalog initializer at level 3.
# Revalidate on macOS x64 before removing this override (Actions job 134067038748).
[profile.release.package.nyaterm-i18n]
opt-level = 1

[patch.crates-io]
suppaftp = { git = "https://github.com/nyakang/suppaftp", rev = "8a9882d1f591711cd83fad3ca370b14a44623025" }
alacritty_terminal = { git = "https://github.com/nyakang/alacritty", rev = "9ea4d170099ccd27aa15edbfc51af461e432f701" }
# gpui-kit takes zed-reqwest from git while this workspace uses the
# published crate; without this both end up in the graph.
[patch."https://github.com/zed-industries/reqwest.git"]
zed-reqwest = { version = "0.12.15-zed" }
